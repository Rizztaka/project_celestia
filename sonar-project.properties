sonar.projectKey=Rizztaka_project_celestia
sonar.organization=rizztaka

# Source code directories to analyze
sonar.sources=apps/api/src,apps/web/src,packages

# Test files and directories
sonar.tests=apps/api/src,apps/web/src,packages,apps/api/tooling
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,apps/api/tooling/**

# Exclude vendor, generated artifacts and static assets
sonar.exclusions=**/node_modules/**,**/.worktrees/**,**/dist/**,**/build/**,**/generated/**,**/coverage/**,**/vendor/**,apps/api/src/games/genshin/static/**

# Exclude test files, test fixtures and tooling from copy-paste duplication checks
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.fixtures.ts,**/fixtures/**,apps/api/tooling/**
