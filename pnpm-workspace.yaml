packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  proxy-addr: ^2.0.8
  body-parser: ^2.4.0
  qs: ^6.16.1
  fast-uri: ^3.1.6
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  enka-network-api: true
  esbuild: true
  prisma: true
  unrs-resolver: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'genshin-db@5.2.14'
  - 'genshin-db@5.2.15'
  - 'pino@9.14.0'
  - 'prisma@7.10.1'
  - 'semver@6.3.1'
minimumReleaseAgeExclude:
  - genshin-db@5.2.15
